<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>김미정 학생 중복 확인 · 그루앙스 3000</title>
<style>
  :root{--bg:#faf8f4;--fg:#1a1a1a;--card:#fff;--line:#eee;--sub:#666;--green:#0d281c;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14181a;--fg:#f0efe9;--card:#1d2225;--line:#2c3337;--sub:#9aa3a7;}}
  :root[data-theme="dark"]{--bg:#14181a;--fg:#f0efe9;--card:#1d2225;--line:#2c3337;--sub:#9aa3a7;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;padding:16px;padding-bottom:40px;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:18px;margin:0 0 4px;}
  .note{font-size:12px;color:var(--sub);margin:0 0 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .muted{color:var(--sub);}
  .empty{text-align:center;color:var(--sub);padding:24px;font-size:13px;}
  .btn{width:100%;padding:12px;border:0;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-secondary{background:#eee;color:#444;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .datechip{display:inline-block;padding:3px 8px;margin:2px 4px 2px 0;border-radius:8px;font-size:11px;background:#eef2ef;color:#333;}
  .datechip.overlap{background:#fdf3f2;color:#b3352c;font-weight:700;}
  .badge-ok{background:#e8f5e9;color:#2B7A2E;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;}
  .badge-warn{background:#fdf3e7;color:#a8761a;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;}
  .badge-bad{background:#fdf3f2;color:#b3352c;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--green);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:999;}
</style>
</head>
<body>
<div class="wrap">
  <h1>중복 학생 확인 — 김미정</h1>
  <p class="note">3학년(jr3) 트랙에서 "김미정" 이름으로 등록된 반을 모두 찾아 날짜가 겹치는지 확인합니다.</p>
  <div id="host"><div class="empty">불러오는 중...</div></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, where, getDocs, updateDoc
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKFSHiCvYpAlylqw73SDznhRwUH128bd4",
  authDomain: "gruance3000.firebaseapp.com",
  projectId: "gruance3000",
  storageBucket: "gruance3000.firebasestorage.app",
  messagingSenderId: "427032975760",
  appId: "1:427032975760:web:f2b07d003fb9837a14fb15",
  measurementId: "G-5Q9HLVKEGV"
};
const fbapp = initializeApp(firebaseConfig);
const db = getFirestore(fbapp);
const COL_ATTEMPTS = 'wordtest_attempts';
const COL_REVIEWPOOL = 'wordtest_reviewpool';
const TARGET_NAME = '김미정';

const el = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
function showToast(m){ const t = el(`<div class="toast">${m}</div>`); document.body.appendChild(t); setTimeout(()=>t.remove(), 2500); }

const host = document.getElementById('host');

async function main(){
  let attempts = [];
  try{
    const q = query(collection(db, COL_ATTEMPTS), where('track','==','jr3'), where('name','==',TARGET_NAME));
    const snap = await getDocs(q);
    snap.forEach(d => attempts.push({id:d.id, ...d.data()}));
  }catch(e){
    host.innerHTML = '';
    host.appendChild(el(`<div class="card"><b style="color:#b3352c;">조회 중 오류가 발생했습니다</b><p class="muted">${e.message}</p></div>`));
    console.error(e);
    return;
  }

  host.innerHTML = '';

  if(attempts.length === 0){
    host.appendChild(el(`<div class="empty">"${TARGET_NAME}" 이름의 3학년 응시 기록을 찾지 못했습니다.</div>`));
    return;
  }

  const byKey = {};
  attempts.forEach(a=>{
    if(!byKey[a.studentKey]) byKey[a.studentKey] = { key:a.studentKey, cls:a.cls, num:a.num, name:a.name, rows:[] };
    byKey[a.studentKey].rows.push(a);
  });
  const groups = Object.values(byKey).sort((a,b)=> a.cls.localeCompare(b.cls,'ko',{numeric:true}));

  if(groups.length < 2){
    host.appendChild(el(`<div class="card"><b style="color:#2B7A2E;">중복이 없습니다</b><p class="muted" style="margin-bottom:0;">"${TARGET_NAME}" 이름으로 등록된 3학년 학생 키가 1개(${groups[0].cls} ${groups[0].num}번)뿐입니다.</p></div>`));
    return;
  }

  groups.forEach(g=>{
    g.dates = [...new Set(g.rows.map(r=>r.date))].sort();
  });

  // 반을 "2반" 기준으로 식별 (포함된 반 이름에 "2" 또는 "3"이 들어있는지로 매칭)
  const g2 = groups.find(g => /2반/.test(g.cls));
  const g3 = groups.find(g => /3반/.test(g.cls));

  host.appendChild(el(`<div class="card"><b>"${TARGET_NAME}" 이름으로 ${groups.length}개의 서로 다른 학생 키가 발견되었습니다.</b></div>`));

  groups.forEach(g=>{
    const card = el(`<div class="card"></div>`);
    card.appendChild(el(`<div style="font-size:14px; font-weight:700; margin-bottom:4px;">${g.cls} ${g.num}번 <span class="muted" style="font-weight:400; font-size:12px;">(key: ${g.key})</span></div>`));
    card.appendChild(el(`<div class="muted" style="font-size:12px; margin-bottom:8px;">응시 ${g.rows.length}건 · 날짜 ${g.dates.length}일</div>`));
    const chipBox = el(`<div></div>`);
    g.dates.forEach(d=>{
      chipBox.appendChild(el(`<span class="datechip">${d}</span>`));
    });
    card.appendChild(chipBox);
    host.appendChild(card);
  });

  if(!g2 || !g3){
    host.appendChild(el(`<div class="card"><b style="color:#a8761a;">2반·3반 둘 다 찾지 못했습니다</b><p class="muted" style="margin-bottom:0;">반 이름 표기가 예상과 달라서(예: "3학년 2반"이 아닌 다른 형식) 자동으로 식별하지 못했습니다. 위 목록을 직접 보고 판단해 주세요.</p></div>`));
    return;
  }

  const overlap = g2.dates.filter(d => g3.dates.includes(d));

  const resultCard = el(`<div class="card"></div>`);
  if(overlap.length > 0){
    resultCard.appendChild(el(`<b style="color:#b3352c;">⚠️ 날짜가 겹칩니다 (${overlap.length}일)</b>`));
    resultCard.appendChild(el(`<p class="muted" style="font-size:13px;">아래 날짜에 2반과 3반 양쪽 모두 응시 기록이 있습니다. 같은 사람이 같은 날 두 반에서 시험을 볼 수는 없으니, <b>서로 다른 두 명의 학생</b>일 가능성이 높습니다. 자동으로 합치지 않았습니다.</p>`));
    const chipBox = el(`<div style="margin-top:6px;"></div>`);
    overlap.forEach(d=> chipBox.appendChild(el(`<span class="datechip overlap">${d}</span>`)));
    resultCard.appendChild(chipBox);
  } else {
    resultCard.appendChild(el(`<b style="color:#2B7A2E;">✅ 겹치는 날짜가 없습니다</b>`));
    resultCard.appendChild(el(`<p class="muted" style="font-size:13px;">${g2.cls} ${g2.num}번과 ${g3.cls} ${g3.num}번의 응시 날짜가 서로 겹치지 않습니다. 같은 학생이 반 표기만 다르게 등록된 것으로 보입니다. 아래 버튼을 누르면 3반 기록을 전부 2반으로 옮기고, 3반 항목은 사라집니다.</p>`));
    const mergeBtn = el(`<button class="btn btn-primary" style="margin-top:10px;">${g3.cls} ${g3.num}번 기록을 ${g2.cls} ${g2.num}번으로 합치기</button>`);
    mergeBtn.onclick = async () => {
      const typed = prompt(`정말 합치시겠습니까?\n\n${g3.cls} ${g3.num}번(응시 ${g3.rows.length}건)의 기록이\n${g2.cls} ${g2.num}번으로 전부 옮겨집니다.\n되돌릴 수 없습니다.\n\n계속하려면 "${TARGET_NAME}"을(를) 입력하세요.`);
      if(typed === null) return;
      if(typed.trim() !== TARGET_NAME){ showToast('이름이 일치하지 않아 취소했습니다'); return; }

      mergeBtn.disabled = true;
      mergeBtn.textContent = '합치는 중...';
      try{
        // 1) 응시 기록 전부 2반으로 재배정
        for(const row of g3.rows){
          await updateDoc(doc(db, COL_ATTEMPTS, row.id), { studentKey: g2.key, cls: g2.cls, num: g2.num });
        }
        // 2) 복습 대기 단어 병합 (겹치는 단어는 2반 쪽 값 유지)
        try{
          const p3snap = await getDoc(doc(db, COL_REVIEWPOOL, g3.key));
          if(p3snap.exists()){
            const words3 = p3snap.data().words || {};
            const p2snap = await getDoc(doc(db, COL_REVIEWPOOL, g2.key));
            const words2 = p2snap.exists() ? (p2snap.data().words || {}) : {};
            await setDoc(doc(db, COL_REVIEWPOOL, g2.key), { words: {...words3, ...words2}, updatedAt: Date.now() });
            await deleteDoc(doc(db, COL_REVIEWPOOL, g3.key));
          }
        }catch(e){ console.error('reviewpool merge failed', e); }

        showToast(`${g3.cls} ${g3.num}번 기록 ${g3.rows.length}건을 ${g2.cls} ${g2.num}번으로 합쳤습니다`);
        mergeBtn.textContent = '✅ 완료되었습니다';
      }catch(e){
        console.error(e);
        showToast('합치기 중 오류가 발생했습니다');
        mergeBtn.disabled = false;
        mergeBtn.textContent = `${g3.cls} ${g3.num}번 기록을 ${g2.cls} ${g2.num}번으로 합치기`;
      }
    };
    resultCard.appendChild(mergeBtn);
  }
  host.appendChild(resultCard);
}

main();
</script>
</body>
</html>
