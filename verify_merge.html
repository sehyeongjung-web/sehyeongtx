<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>병합 결과 검증</title>
<style>
  body{margin:0;background:#faf8f4;color:#1a1a1a;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;padding:16px;}
  .wrap{max-width:560px;margin:0 auto;}
  .card{background:#fff;border:1px solid #eee;border-radius:12px;padding:16px;margin-bottom:12px;white-space:pre-wrap;font-size:13px;line-height:1.6;}
</style>
</head>
<body><div class="wrap"><h2>병합 결과 검증</h2><div id="host" class="card">불러오는 중...</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDKFSHiCvYpAlylqw73SDznhRwUH128bd4",
  authDomain: "gruance3000.firebaseapp.com",
  projectId: "gruance3000",
  storageBucket: "gruance3000.firebasestorage.app",
  messagingSenderId: "427032975760",
  appId: "1:427032975760:web:f2b07d003fb9837a14fb15",
  measurementId: "G-5Q9HLVKEGV"
};
const db = getFirestore(initializeApp(firebaseConfig));
const host = document.getElementById('host');
let out = '';
try{
  const q = query(collection(db,'wordtest_attempts'), where('track','==','jr3'), where('name','==','김미정'));
  const snap = await getDocs(q);
  const byKey = {};
  snap.forEach(d=>{
    const a = d.data();
    if(!byKey[a.studentKey]) byKey[a.studentKey] = {cls:a.cls, num:a.num, dates:[]};
    byKey[a.studentKey].dates.push(a.date);
  });
  out += '=== 응시 기록(wordtest_attempts) studentKey별 집계 ===\\n';
  Object.entries(byKey).forEach(([k,v])=>{
    v.dates.sort();
    out += `key=${k}  ${v.cls} ${v.num}번  응시 ${v.dates.length}건\\n  날짜: ${v.dates.join(', ')}\\n\\n`;
  });
  if(Object.keys(byKey).length===0) out += '(기록 없음)\\n\\n';

  out += '=== 복습풀(wordtest_reviewpool) 잔존 여부 ===\\n';
  for(const key of Object.keys(byKey)){
    const s = await getDoc(doc(db,'wordtest_reviewpool', key));
    out += `key=${key}  존재여부=${s.exists()}` + (s.exists() ? `  단어수=${Object.keys(s.data().words||{}).length}` : '') + '\\n';
  }
}catch(e){
  out = '오류: ' + e.message;
}
host.textContent = out;
</script>
</body></html>
