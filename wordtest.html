  .btn-secondary { background: #eee; color: #444; }

  label { display:block; font-size: 13px; color: #555; margin-bottom: 4px; font-weight: 600; }
  .backlink { display:inline-block; margin-bottom: 10px; color: #0d281c; font-weight: 600; text-decoration: none; font-size: 14px; }
  .choice-btn {
    display:block; width:100%; text-align:left; padding: 14px; margin-bottom: 8px;
    border: 2px solid #ddd; border-radius: 10px; background:#fff; font-size: 15px; cursor: pointer;
  }
  .choice-btn.correct { border-color: #2B7A2E; background: #e8f5e9; }
  .choice-btn.wrong { border-color: #b3352c; background: #fde8e6; }
  .choice-btn:disabled { opacity: 0.85; }
  .timerbar-wrap { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .timerbar { height: 100%; background: #e6c25a; transition: width 0.1s linear; }
  .qprogress { font-size: 13px; color: #888; margin-bottom: 8px; }
  .qword { font-size: 28px; font-weight: 800; color: #0d281c; margin: 12px 0 18px; text-align:center; }
  .tabs { display:flex; border-bottom: 2px solid #eee; margin-bottom: 12px; }
  .tab { flex:1; text-align:center; padding: 10px; font-weight:600; color:#888; cursor:pointer; border-bottom: 3px solid transparent; }
  .tab.active { color: #0d281c; border-bottom-color: #e6c25a; }
  .statrow { display:flex; justify-content: space-between; align-items:center; margin-bottom: 4px; }
  .badge-ok { background:#e8f5e9; color:#2B7A2E; padding: 2px 8px; border-radius: 6px; font-size:12px; font-weight:600; }
  .badge-warn { background:#fde8e6; color:#b3352c; padding: 2px 8px; border-radius: 6px; font-size:12px; font-weight:600; }
  .barwrap { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:12px; }
  .barwrap .lbl { width: 50px; color:#666; }
  .barwrap .track { flex:1; background:#eee; border-radius:4px; height:14px; overflow:hidden; }
  .barwrap .track > div { height:100%; }
  .barwrap .val { width: 40px; text-align:right; color:#666; }
  .empty { text-align:center; color:#999; padding: 30px 0; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#0d281c; color:#fff; padding:10px 18px; border-radius:20px; font-size:14px; z-index:999; }
  .homebtn { display:block; background:#fff; border:2px solid #0d281c; border-radius:12px; padding:18px; margin-bottom:12px; text-align:center; font-weight:700; color:#0d281c; cursor:pointer; }
  .homebtn.gold { background:#0d281c; color:#e6c25a; border-color:#0d281c; }
  .final-score { text-align:center; padding: 20px 0; }
  .final-score .num { font-size: 48px; font-weight:900; color:#0d281c; }
  .row3 { display:flex; gap:8px; }
  .row3 > * { flex:1; }

  const t = el(`<div class="toast">${msg}</div>`);

}

async function loadSettings(){
  try{
    const snap = await getDoc(doc(db, COL_SETTINGS, SETTINGS_DOC));
    if(snap.exists()) Object.assign(SETTINGS, snap.data());
  }catch(e){ console.error('settings load failed', e); }
}
async function saveSettings(){
  await setDoc(doc(db, COL_SETTINGS, SETTINGS_DOC), SETTINGS);
}

function computeDayInfo(dateObj){
  if(!SETTINGS.startDate) return {idx:null, weekend:false, notStarted:true};
  const start = new Date(SETTINGS.startDate + 'T00:00:00');
  const now = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
  const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  if(now < startMid) return {idx:null, weekend:false, notStarted:true};
  let idx = -1;
  let cursor = new Date(startMid);
  while(cursor <= now){
    const day = cursor.getDay();
    if(day !== 0 && day !== 6) idx++;
    cursor.setDate(cursor.getDate()+1);
  }
  const todayDay = now.getDay();
  if(todayDay === 0 || todayDay === 6) return {idx:null, weekend:true, notStarted:false};
  return {idx, weekend:false, notStarted:false};
}

function unitRangeForDayIndex(idx){
  const startUnit = idx*2 + 1;
  const endUnit = idx*2 + 2;
  if(startUnit > 82) return null;
  return {start: startUnit, end: Math.min(endUnit,82)};
}

function isWithinTestWindow(){
  const now = new Date();
  return now.getHours() >= SETTINGS.openHour;
}

function studentKey(cls, num){ return (cls+'_'+num).replace(/\s+/g,''); }

// day type: 'new' (mon/tue/thu/fri), 'new+review' (wed), 'review' (sat/sun)
function getDayType(dateObj){
  const d = dateObj.getDay(); // 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
  if(d===0 || d===6) return 'review';
  if(d===3) return 'new+review';
  return 'new';
}

async function loadReviewPool(key){
  try{
    const snap = await getDoc(doc(db, COL_REVIEWPOOL, key));
    if(snap.exists()) return snap.data().words || {};
  }catch(e){ console.error('pool load failed', e); }
  return {};
}
async function saveReviewPool(key, words){
  await setDoc(doc(db, COL_REVIEWPOOL, key), { words, updatedAt: Date.now() });
}

// Update the pool after any test (new-unit or review) using per-word right/wrong results
async function updatePoolAfterResults(key, wordResults){
  const pool = await loadReviewPool(key);
  for(const r of wordResults){
    if(r.correct){
      if(pool[r.en]){
        pool[r.en].streak = (pool[r.en].streak||0) + 1;
        if(pool[r.en].streak >= MASTERY_STREAK){
          delete pool[r.en]; // graduated, remove from pool
        }
      }
      // if word wasn't in pool and answered correctly, nothing to do
    } else {
      pool[r.en] = {
        ko: r.ko, unit: r.unit,
        wrongCount: (pool[r.en] ? pool[r.en].wrongCount : 0) + 1,
        streak: 0
      };
    }
  }
  await saveReviewPool(key, pool);
  return pool;
}

    if(!cls || !num || !name){ showToast('반, 번호, 이름을 모두 입력해주세요'); return; }
    student = { cls, num, name, key: studentKey(cls,num) };
    await render('testGate');
  };
};

// ============== TEST GATE (checks window / day) ==============
ROUTES.testGate = async (main) => {
  main.appendChild(el(`<div class="empty">확인 중...</div>`));
  const now = new Date();
  const dayType = getDayType(now); // 'new' | 'new+review' | 'review'

  if(!isWithinTestWindow()){
    main.innerHTML = '';
    main.appendChild(el(`<div class="card"><h2>아직 시험 시간이 아닙니다</h2><p class="muted">오늘 시험은 오후 ${SETTINGS.openHour}시부터 밤 12시까지 볼 수 있어요.</p></div>`));
    main.appendChild(backHomeBtn());
    return;
  }

  if(dayType === 'review'){
    // Saturday/Sunday: review-only day, no new units
    const already = await hasAttemptedToday(student.key, todayStr(now), 'review');
    const pool = await loadReviewPool(student.key);
    const poolWords = Object.keys(pool);
    main.innerHTML = '';
    if(already){
      main.appendChild(el(`<div class="card"><h2>오늘 복습 시험은 이미 완료했습니다</h2><p class="muted">${student.cls} ${student.num}번 ${student.name}님, 수고하셨어요.</p></div>`));
      main.appendChild(backHomeBtn());
      return;
    }
    if(poolWords.length === 0){
      main.appendChild(el(`<div class="card"><h2>복습할 단어가 없습니다!</h2><p class="muted">지금까지 틀린 단어가 없거나 이미 다 마스터했어요. 잘하고 있어요 👍</p></div>`));
      main.appendChild(backHomeBtn());
      return;
    }
    main.appendChild(el(`
      <div class="card">
        <h2>복습 시험 (주말)</h2>
        <p class="muted">${student.cls} ${student.num}번 ${student.name}님, 그동안 틀렸던 단어 ${poolWords.length}개를 다시 풀어봅니다.</p>
        <p class="muted">문제당 제한시간: ${SETTINGS.secondsPerQuestion}초 · 5지선다 · 2번 연속 맞히면 복습 목록에서 빠집니다</p>
      </div>
    `));
    const startBtn = el(`<div class="homebtn gold">복습 시험 시작</div>`);
    startBtn.onclick = () => startReviewTest(pool, {thenGoHome:true});
    main.appendChild(startBtn);
    main.appendChild(backHomeBtn());
    return;
  }

  // dayType === 'new' or 'new+review'
  const info = computeDayInfo(now);
  if(info.notStarted){
    main.innerHTML = '';
    main.appendChild(el(`<div class="card"><h2>아직 시작 전입니다</h2><p class="muted">시험 시작일이 아직 되지 않았어요. 선생님께 문의해주세요.</p></div>`));
    main.appendChild(backHomeBtn());
    return;
  }
  const range = unitRangeForDayIndex(info.idx);
  if(!range){
    main.innerHTML = '';
    main.appendChild(el(`<div class="card"><h2>전체 과정을 완료했습니다</h2><p class="muted">루트북 전체 82유닛 시험이 끝났습니다. 수고하셨습니다!</p></div>`));
    main.appendChild(backHomeBtn());
    return;
  }
  const today = todayStr(now);
  const already = await hasAttemptedToday(student.key, today, 'new');
  main.innerHTML = '';
  if(already){
    main.appendChild(el(`<div class="card"><h2>오늘 시험은 이미 완료했습니다</h2><p class="muted">${student.cls} ${student.num}번 ${student.name}님, 내일 다시 시도해주세요.</p></div>`));
    main.appendChild(backHomeBtn());
    return;
  }
  main.appendChild(el(`
    <div class="card">
      <h2>UNIT ${pad(range.start,3)} ~ UNIT ${pad(range.end,3)}</h2>
      <p class="muted">${student.cls} ${student.num}번 ${student.name}님, 준비되면 시작하세요.</p>
      <p class="muted">문제당 제한시간: ${SETTINGS.secondsPerQuestion}초 · 5지선다</p>
      ${dayType==='new+review' ? '<p class="muted">오늘은 수요일 — 시험 후 이번 주 복습도 이어집니다.</p>' : ''}
    </div>
  `));
  const startBtn = el(`<div class="homebtn gold">시험 시작</div>`);
  startBtn.onclick = () => startTest(range, dayType);
  main.appendChild(startBtn);
  main.appendChild(backHomeBtn());
};

function backHomeBtn(){
  const b = el(`<div class="homebtn" style="margin-top:8px;">처음으로</div>`);
  b.onclick = () => render('home');
  return b;
}

function attemptDocId(key, dateStr, mode){
  return key + '_' + dateStr + (mode==='review' ? '_review' : '');
}

async function hasAttemptedToday(key, dateStr, mode){
  try{
    const snap = await getDoc(doc(db, COL_ATTEMPTS, attemptDocId(key, dateStr, mode)));
    return snap.exists();
  }catch(e){ console.error(e); return false; }
}

// ============== TEST ENGINE ==============
let testState = null;

function buildAllMeaningPool(){
  const pool = [];
  for(const u of UNITS){
    for(const w of u.words){
      pool.push({en: w.en, ko: w.ko, unit: u.n});
    }
  }
  return pool;
}
const ALL_WORDS_POOL = buildAllMeaningPool();

async function getRecentMeanings(key, days){
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const cutoffStr = todayStr(cutoff);
  const recent = new Set();
  try{
    const q = query(collection(db, COL_ATTEMPTS), where('studentKey','==',key), where('date','>=',cutoffStr));
    const snap = await getDocs(q);
    snap.forEach(docSnap => {
      const data = docSnap.data();
      (data.choicesShown || []).forEach(m => recent.add(m));
    });
  }catch(e){ console.error('recent meanings fetch failed', e); }
  return recent;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuestionsFromWords(words, recentMeanings){
  const usedThisSession = new Set();
  const questions = [];
  for(const w of words){
    usedThisSession.add(w.ko);
    let candidates = ALL_WORDS_POOL.filter(x => x.ko !== w.ko && !recentMeanings.has(x.ko) && !usedThisSession.has(x.ko));
    if(candidates.length < 4){
      candidates = ALL_WORDS_POOL.filter(x => x.ko !== w.ko && !usedThisSession.has(x.ko));
    }
    const distractors = shuffle(candidates).slice(0,4).map(x=>x.ko);
    distractors.forEach(d => usedThisSession.add(d));
    const choices = shuffle([w.ko, ...distractors]);
    questions.push({ en: w.en, correct: w.ko, choices, unit: w.unit });
  }
  return questions;
}

async function startTest(range, dayType){
  main.innerHTML = '';
  main.appendChild(el(`<div class="empty">문제 준비 중...</div>`));

  const words = [];
  for(const u of UNITS){
    if(u.n >= range.start && u.n <= range.end){
      for(const w of u.words) words.push({en:w.en, ko:w.ko, unit:u.n});
    }
  }
  const recentMeanings = await getRecentMeanings(student.key, 7);
  const questions = buildQuestionsFromWords(words, recentMeanings);

  testState = {
    mode: 'new', dayType, range, questions, idx: 0, correctCount: 0,
    unitStats: {}, wordResults: [], choicesShownFlat: [],
    startedAt: Date.now(), timerHandle: null
  };
  for(let u=range.start; u<=range.end; u++) testState.unitStats[u] = {correct:0, total:0};

  renderQuestion();
}

async function startReviewTest(pool, opts){
  main.innerHTML = '';
  main.appendChild(el(`<div class="empty">복습 문제 준비 중...</div>`));
  const words = Object.keys(pool).map(en => ({en, ko: pool[en].ko, unit: pool[en].unit}));
  const recentMeanings = await getRecentMeanings(student.key, 7);
  const questions = buildQuestionsFromWords(shuffle(words), recentMeanings);

  testState = {
    mode: 'review', thenGoHome: !!(opts && opts.thenGoHome),
    questions, idx: 0, correctCount: 0,
    unitStats: {}, wordResults: [], choicesShownFlat: [],
    startedAt: Date.now(), timerHandle: null
  };
  questions.forEach(q => { if(!testState.unitStats[q.unit]) testState.unitStats[q.unit] = {correct:0,total:0}; });

  renderQuestion();
}

function renderQuestion(){
  clearInterval(testState.timerHandle);
  main.innerHTML = '';
  const q = testState.questions[testState.idx];
  const total = testState.questions.length;
  const modeLabel = testState.mode === 'review' ? '복습' : `UNIT ${pad(q.unit,3)}`;
  main.appendChild(el(`<div class="qprogress">문제 ${testState.idx+1} / ${total} · ${modeLabel}</div>`));
  main.appendChild(el(`<div class="timerbar-wrap"><div class="timerbar" id="tbar" style="width:100%;"></div></div>`));
  main.appendChild(el(`<div class="qword">${q.en}</div>`));
  const choiceWrap = el(`<div></div>`);
  q.choices.forEach(choice => {
    const b = el(`<button class="choice-btn">${choice}</button>`);
    b.onclick = () => answerQuestion(choice);
    choiceWrap.appendChild(b);
  });
  main.appendChild(choiceWrap);

  const totalMs = SETTINGS.secondsPerQuestion * 1000;
  const startTime = Date.now();
  testState.timerHandle = setInterval(() => {
    const elapsed = Date.now() - startTime;
    const pct = Math.max(0, 100 - (elapsed/totalMs)*100);
    const bar = document.getElementById('tbar');
    if(bar) bar.style.width = pct + '%';
    if(elapsed >= totalMs){
      clearInterval(testState.timerHandle);
      answerQuestion(null);
    }
  }, 100);
}

function answerQuestion(chosen){
  clearInterval(testState.timerHandle);
  const q = testState.questions[testState.idx];
  const correct = chosen === q.correct;
  testState.unitStats[q.unit].total++;
  if(correct){ testState.correctCount++; testState.unitStats[q.unit].correct++; }
  testState.choicesShownFlat.push(...q.choices);
  testState.wordResults.push({ en: q.en, ko: q.correct, unit: q.unit, correct });

  const buttons = main.querySelectorAll('.choice-btn');
  buttons.forEach(b => {
    b.disabled = true;
    if(b.textContent === q.correct) b.classList.add('correct');
    else if(b.textContent === chosen) b.classList.add('wrong');
  });

  setTimeout(() => {
    testState.idx++;
    if(testState.idx >= testState.questions.length) finishTest();
    else renderQuestion();
  }, 700);
}

function scoreCard(title, score, total){
  const pct = Math.round(100*score/total);
  return el(`
    <div class="card final-score">
      <div class="muted">${title}</div>
      <div class="num">${score} / ${total}</div>
      <div class="muted">정답률 ${pct}%</div>
    </div>
  `);
}

function unitDetailCard(unitStats){
  const card = el(`<div class="card"></div>`);
  Object.keys(unitStats).sort((a,b)=>a-b).forEach(u=>{
    const st = unitStats[u];
    const p = st.total ? Math.round(100*st.correct/st.total) : 0;
    card.appendChild(el(`
      <div class="barwrap">
        <div class="lbl">U${pad(u,3)}</div>
        <div class="track"><div style="width:${p}%; background:${p<70?'#b3352c':'#2B7A2E'}"></div></div>
        <div class="val">${st.correct}/${st.total}</div>
      </div>
    `));
  });
  return card;
}

async function finishTest(){
  main.innerHTML = '';
  main.appendChild(el(`<div class="empty">저장 중...</div>`));
  const total = testState.questions.length;
  const score = testState.correctCount;
  const mode = testState.mode;
  const today = todayStr();

  const record = {
    studentKey: student.key, cls: student.cls, num: student.num, name: student.name,
    date: today, mode,
    unitStart: mode==='new' ? testState.range.start : null,
    unitEnd: mode==='new' ? testState.range.end : null,
    score, total, unitStats: testState.unitStats,
    wordResults: testState.wordResults,
    choicesShown: Array.from(new Set(testState.choicesShownFlat)),
    createdAt: Date.now()
  };
  try{
    const id = attemptDocId(student.key, today, mode);
    await setDoc(doc(db, COL_ATTEMPTS, id), record);
  }catch(e){ console.error('save failed', e); showToast('저장 중 오류가 발생했습니다'); }

  let updatedPool = {};
  try{
    updatedPool = await updatePoolAfterResults(student.key, testState.wordResults);
  }catch(e){ console.error('pool update failed', e); }

  main.innerHTML = '';
  const title = mode==='new'
    ? `UNIT ${pad(testState.range.start,3)}~${pad(testState.range.end,3)} 결과`
    : '복습 시험 결과';
  main.appendChild(scoreCard(title, score, total));
  main.appendChild(unitDetailCard(testState.unitStats));

  // Wednesday: after the new-unit test, chain into a review round if pool has words
  if(mode==='new' && testState.dayType==='new+review'){
    const poolWords = Object.keys(updatedPool);
    if(poolWords.length > 0){
      const cont = el(`<div class="homebtn gold">이어서 복습 시험 보기 (${poolWords.length}개)</div>`);
      cont.onclick = () => startReviewTest(updatedPool, {thenGoHome:true});
      main.appendChild(cont);
    }
  }
  main.appendChild(backHomeBtn());
}

ROUTES.teacherDashboard = (main, elFn, {tab}) => {
  tab = tab || 'overview';
  main.appendChild(el(`<a class="backlink" id="back">&larr; 처음으로</a>`));
  main.querySelector('#back').onclick = () => render('home');
  main.appendChild(el(`<h1>선생님 대시보드</h1>`));
  const tabs = el(`
    <div class="tabs">
      <div class="tab" data-t="overview">성적 현황</div>
      <div class="tab" data-t="settings">시험 설정</div>
    </div>
  `);
  tabs.querySelectorAll('.tab').forEach(t=>{
    if(t.dataset.t===tab) t.classList.add('active');
    t.onclick = () => render('teacherDashboard', {tab:t.dataset.t});
  });

  const body = el(`<div id="tabBody"></div>`);
  main.appendChild(body);
  if(tab==='overview') renderOverviewTab(body);
  else renderSettingsTab(body);

async function renderOverviewTab(body){
  body.appendChild(el(`<div class="empty">불러오는 중...</div>`));
  let allAttempts = [];
  try{
    const q = query(collection(db, COL_ATTEMPTS), orderBy('date','desc'), fslimit(500));
    const snap = await getDocs(q);
    snap.forEach(d => allAttempts.push(d.data()));
  }catch(e){ console.error(e); }
  body.innerHTML = '';

  const info = computeDayInfo(new Date());
  const range = info.idx!==null ? unitRangeForDayIndex(info.idx) : null;
  body.appendChild(el(`<div class="card"><span class="muted">${range ? `오늘 시험 범위: UNIT ${pad(range.start,3)}~${pad(range.end,3)}` : '오늘은 시험일이 아닙니다'}</span></div>`));

  if(allAttempts.length===0){
    body.appendChild(el(`<div class="empty">아직 응시 기록이 없습니다.</div>`));
    return;
  }

  // group by studentKey
  const byStudent = {};
  allAttempts.forEach(a=>{
    if(!byStudent[a.studentKey]) byStudent[a.studentKey] = [];
    byStudent[a.studentKey].push(a);
  });
  const today = todayStr();
  const students = Object.keys(byStudent).map(key=>{
    const attempts = byStudent[key].sort((a,b)=>a.date.localeCompare(b.date));
    const last = attempts[attempts.length-1];
    const avg = Math.round(100*attempts.reduce((s,a)=>s+a.score/a.total,0)/attempts.length);
    const attemptedToday = attempts.some(a=>a.date===today);
    return {key, cls:last.cls, num:last.num, name:last.name, attempts, avg, attemptedToday};
  }).sort((a,b)=> a.cls.localeCompare(b.cls,'ko',{numeric:true}) || (Number(a.num)-Number(b.num)));

  body.appendChild(el(`<p class="muted" style="margin-bottom:10px;">이름을 누르면 상세 기록을 볼 수 있습니다.</p>`));
  for(const s of students){
    let poolCount = 0;
    try{
      const poolSnap = await getDoc(doc(db, COL_REVIEWPOOL, s.key));
      if(poolSnap.exists()) poolCount = Object.keys(poolSnap.data().words||{}).length;
    }catch(e){ console.error(e); }

    const card = el(`
      <div class="card" style="cursor:pointer;">
        <div class="statrow">
          <span><b>${s.cls} ${s.num}번 ${s.name}</b></span>
          <span>${s.attemptedToday ? '<span class="badge-ok">오늘 응시완료</span>' : '<span class="badge-warn">오늘 미응시</span>'}</span>
        </div>
        <div class="statrow"><span class="muted">누적 응시 ${s.attempts.length}회</span><span class="muted">평균 정답률 ${s.avg}%</span></div>
        <div class="statrow"><span class="muted">복습 대기 단어</span><span class="${poolCount>0?'badge-warn':'badge-ok'}">${poolCount}개</span></div>
        <div class="detailWrap" style="display:none; margin-top:10px; border-top:1px solid #eee; padding-top:10px;"></div>
      </div>
    `);
    card.onclick = () => {
      const dw = card.querySelector('.detailWrap');
      if(dw.style.display==='none'){
        dw.style.display = 'block';
        dw.innerHTML = '';
        s.attempts.slice().reverse().forEach(a=>{
          const pct = Math.round(100*a.score/a.total);
          const modeLabel = a.mode==='review' ? '복습 시험' : `UNIT ${pad(a.unitStart,3)}~${pad(a.unitEnd,3)}`;
          const attemptEl = el(`<div style="margin-bottom:10px;"><div class="statrow"><span class="muted">${a.date} · ${modeLabel}</span><span class="${pct<70?'badge-warn':'badge-ok'}">${a.score}/${a.total} (${pct}%)</span></div></div>`);
          const unitDetail = el(`<div></div>`);
          Object.keys(a.unitStats||{}).sort((x,y)=>x-y).forEach(u=>{
            const st = a.unitStats[u];
            const p = st.total ? Math.round(100*st.correct/st.total) : 0;
            unitDetail.appendChild(el(`
              <div class="barwrap">
                <div class="lbl">U${pad(u,3)}</div>
                <div class="track"><div style="width:${p}%; background:${p<70?'#b3352c':'#2B7A2E'}"></div></div>
                <div class="val">${st.correct}/${st.total}</div>
              </div>
            `));
          });
          attemptEl.appendChild(unitDetail);
          dw.appendChild(attemptEl);
        });
      } else {
        dw.style.display = 'none';
      }
    };
    body.appendChild(card);
  }
}

function renderSettingsTab(body){
  body.appendChild(el(`
    <div class="card">
      <label>시험 시작일 (1일차, 평일만 카운트)</label>
      <input type="text" id="setStart" placeholder="YYYY-MM-DD" value="${SETTINGS.startDate||''}">

      <label>문제당 제한시간(초)</label>
      <input type="text" id="setSec" value="${SETTINGS.secondsPerQuestion}" inputmode="numeric">

      <input type="text" id="setPin" value="${SETTINGS.pin}" inputmode="numeric">

    SETTINGS.pin = body.querySelector('#setPin').value.trim() || '1234';
    await saveSettings();
    showToast('저장되었습니다');
  };
}
